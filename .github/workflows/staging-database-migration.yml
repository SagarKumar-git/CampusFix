name: Staging Database Migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Alembic Migrations (Staging)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run Alembic migration to head
        env:
          ALEMBIC_DATABASE_URL: ${{ secrets.NEON_ALEMBIC_DATABASE_URL }}
        run: |
          if [ -z "${ALEMBIC_DATABASE_URL:-}" ]; then
            echo "::error::NEON_ALEMBIC_DATABASE_URL secret is missing or empty."
            exit 1
          fi
          echo "Starting staging database migration to head (target baseline: 0c98aec98ce5)..."
          alembic upgrade head
          echo "Migration completed successfully. Current database revision:"
          alembic current
