# A generic, single database configuration for Alembic.

[alembic]
# Path to migration scripts
script_location = alembic

# Path to search for sys.path
prepend_sys_path = .

# Format using os-specific path separator
version_path_separator = os
path_separator = os

# Dynamic URL is injected programmatically from app.core.config.settings in env.py
# to eliminate static credential storage.

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
